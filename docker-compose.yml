version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trainbow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trainbow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trainbow_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-trainbow_hub_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trainbow_user} -d ${POSTGRES_DB:-trainbow_hub_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
