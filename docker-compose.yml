version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trainbow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trainbow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trainbow_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-trainbow_hub_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trainbow_user} -d ${POSTGRES_DB:-trainbow_hub_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  tools_service:
    build:
      context: ./tools-service
      dockerfile: Dockerfile
    container_name: trainbow_tools_service
    restart: unless-stopped
    environment:
      TOOLS_SERVICE_SECRET: ${TOOLS_SERVICE_SECRET:-trainbow_tools_secret_dev}
      PORT: 8000
    ports:
      - "${TOOLS_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local

